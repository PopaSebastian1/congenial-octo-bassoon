name: Sync main into test-feature

on:
  push:
    branches:
      - main

jobs:
  sync-to-test-feature:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if test-feature is behind main
        id: diff
        run: |
          git fetch origin main test-feature
          if git rev-list --left-right --count origin/test-feature...origin/main | awk '{print $2}' | grep -q '[1-9]'; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main into test-feature without creating a separate branch
        if: steps.diff.outputs.needs_sync == 'true'
        run: |
          git checkout test-feature
          git merge origin/main --no-edit || {
            echo "Merge has conflicts. Aborting without changing test-feature."
            exit 1
          }
          git push origin test-feature
