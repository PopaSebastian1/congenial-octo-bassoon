name: Auto PR from main to test-feature

on:
  push:
    branches:
      - main

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if test-feature differs from main
        id: diff
        run: |
          git fetch origin test-feature
          if git diff --quiet origin/test-feature...HEAD; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch and create PR
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git checkout -B sync-main-to-test-feature origin/main
          git push --force-with-lease origin sync-main-to-test-feature

          if gh pr list --repo "${{ github.repository }}" --head "sync-main-to-test-feature" --base "test-feature" --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "test-feature" \
              --head "sync-main-to-test-feature" \
              --title "Sync main -> test-feature" \
              --body "This PR was created automatically after a push or merge to main."
          else
            echo "PR already exists for sync-main-to-test-feature -> test-feature"
          fi

      - name: Auto-merge PR if no conflicts
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --head "sync-main-to-test-feature" --base "test-feature" --json number --jq '.[0].number')

          if [ -n "$pr_number" ] && [ "$pr_number" != "null" ]; then
            gh pr merge "$pr_number" --repo "${{ github.repository }}" --merge --auto || echo "PR was not auto-merged because it has conflicts or is not mergeable yet."
          else
            echo "No PR found to auto-merge."
          fi
